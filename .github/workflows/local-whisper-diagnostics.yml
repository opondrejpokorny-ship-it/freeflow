name: Local Whisper Diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-log:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Capture test output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee local-whisper-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-whisper-test-log
          path: local-whisper-test.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
