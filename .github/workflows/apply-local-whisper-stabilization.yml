name: Apply local Whisper stabilization

on:
  push:
    branches:
      - fix/local-whisper-stabilization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/local-whisper-stabilization
          fetch-depth: 0

      - name: Patch AppState and Settings
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/apply_large_files.py
          python3 /tmp/apply_large_files.py

      - name: Commit large-file integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire local Whisper into dictation and settings"
          git push origin HEAD:fix/local-whisper-stabilization
