name: macOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          swift --version
          xcodebuild -version
          cmake --version

      - name: Run tests
        run: make test

      - name: Build development app with bundled runtime
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make CODESIGN_IDENTITY=- 2>&1 | tee build.log

      - name: Extract build diagnostics
        if: always()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            grep -E "(^|[[:space:]])(error:|fatal error:|warning:)|make(\[[0-9]+\])?: \*\*\*" build.log > build-diagnostics.txt || true
            tail -n 160 build.log > build-tail.txt
          else
            echo "build.log was not created" > build-diagnostics.txt
            cp build-diagnostics.txt build-tail.txt
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-diagnostics
          path: |
            build-diagnostics.txt
            build-tail.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify app bundle
        id: verify_app
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            APP="build/FreeFlow Dev.app"
            test -x "$APP/Contents/MacOS/FreeFlow Dev"
            test -x "$APP/Contents/MacOS/whisper-cli"
            test -f "$APP/Contents/Resources/whisper-runtime.json"
            test -f "$APP/Contents/Resources/ThirdPartyNotices/whisper.cpp-LICENSE.txt"
            bash scripts/verify-whisper-runtime.sh \
              "$APP/Contents/MacOS/whisper-cli" \
              "$APP/Contents/Resources/whisper-runtime.json" \
              "$(uname -m)"
            codesign --verify --strict "$APP/Contents/MacOS/whisper-cli"
            codesign --verify --deep --strict "$APP"
          } 2>&1 | tee app-bundle-verification.log

      - name: Upload app bundle verification diagnostics
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-verification-diagnostics
          path: app-bundle-verification.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when app bundle verification failed
        if: steps.verify_app.outcome == 'failure'
        run: exit 1

  verify-universal-whisper-runtime:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal runtime
        id: universal_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make whisper-runtime ARCH=universal 2>&1 | tee universal-runtime-build.log

      - name: Upload universal runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-whisper-runtime-diagnostics
          path: universal-runtime-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when universal runtime build failed
        if: steps.universal_build.outcome == 'failure'
        run: exit 1

      - name: Verify universal runtime
        if: steps.universal_build.outcome == 'success'
        run: |
          bash scripts/verify-whisper-runtime.sh \
            build/whisper-runtime/universal/whisper-cli \
            build/whisper-runtime/universal/whisper-runtime.json \
            universal
          lipo build/whisper-runtime/universal/whisper-cli -verify_arch arm64 x86_64
