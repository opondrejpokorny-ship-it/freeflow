name: Apply multilingual refactor

on:
  push:
    branches:
      - feature/multilingual-foundation
    paths:
      - .github/workflows/apply-multilingual-refactor.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: apply-multilingual-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/multilingual-foundation
          fetch-depth: 0

      - name: Apply guarded source edits
        id: refactor
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_multilingual_refactor.py 2>&1 | tee apply-refactor.log

      - name: Validate patch formatting
        id: validate
        if: steps.refactor.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Upload patched sources and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multilingual-refactor-result
          path: |
            Sources/AppState.swift
            Sources/SettingsView.swift
            Sources/PostProcessingService.swift
            apply-refactor.log
          if-no-files-found: error
          retention-days: 7

      - name: Commit applied refactor
        id: push
        if: steps.refactor.outcome == 'success' && steps.validate.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Refactor already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/AppState.swift Sources/SettingsView.swift Sources/PostProcessingService.swift
          git commit -m "Wire multilingual settings into app"
          git push origin HEAD:feature/multilingual-foundation

      - name: Report result in pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REFACTOR_OUTCOME: ${{ steps.refactor.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          cat > refactor-report.md <<EOF
          ### Multilingual refactor automation

          - Refactor: **${REFACTOR_OUTCOME}**
          - Diff validation: **${VALIDATE_OUTCOME}**
          - Branch push: **${PUSH_OUTCOME}**
          - Workflow run: \`${RUN_ID}\`
          - Artifact: \`multilingual-refactor-result\`

          The artifact contains the patched AppState, SettingsView, PostProcessingService, and the guarded migration log.
          EOF
          gh pr comment 1 --body-file refactor-report.md

      - name: Fail on invalid refactor
        if: steps.refactor.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1
